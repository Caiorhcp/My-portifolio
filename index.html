<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caio Gonçalves · Desenvolvedor Full Stack</title>
    <meta name="description" content="Portfólio de Caio Gonçalves, desenvolvedor full stack em Missão Velha (CE): web, mobile, APIs e IA que roda no navegador, como o S.A.P.O." />
    <meta property="og:title" content="Caio Gonçalves · Desenvolvedor Full Stack" />
    <meta property="og:description" content="Web, mobile, APIs e IA que roda no navegador." />
    <meta name="theme-color" content="#f4efe4" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <script>
      // aplica o tema antes da pintura, sem piscar
      try {
        var t = localStorage.getItem("tema");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
